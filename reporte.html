<main class="seccion-reporte">
    <div class="contenedor-reporte">
        <h2>Reportar un problema</h2>
        <p class="intro-reporte">Ayudanos a mantener la información de los murales actualizada.</p>

        <form id="form-reporte" class="form-reporte">
            <div class="campo-reporte">
                <label for="reporte-mural">Mural</label>
                <select id="reporte-mural" name="id_mural" required>
                    <option value="" disabled selected>Elegí el mural...</option>
                </select>
            </div>

            <div class="campo-reporte">
                <label>Motivo del reporte</label>
                <div class="opciones-reporte">
                    <label class="opcion-reporte">
                        <input type="radio" name="causa" value="Falta info" required>
                        <span><strong>Falta información</strong><small>Hay datos del mural que no están disponibles.</small></span>
                    </label>
                    <label class="opcion-reporte">
                        <input type="radio" name="causa" value="Dato erróneo">
                        <span><strong>Información incorrecta</strong><small>Alguno de los datos publicados no es correcto.</small></span>
                    </label>
                    <label class="opcion-reporte">
                        <input type="radio" name="causa" value="Falta mural">
                        <span><strong>Falta un mural</strong><small>Existe un mural que todavía no aparece en la página.</small></span>
                    </label>
                </div>
            </div>

            <div class="campo-reporte">
                <label for="imagen">Adjuntar imagen (opcional)</label>
                <input class="archivo-reporte" type="file" id="imagen" name="imagen" accept="image/png,image/jpeg,image/jpg">
            </div>

            <div class="campo-reporte">
                <label for="descripcion">Descripción del problema</label>
                <textarea id="descripcion" name="descripcion" rows="7" maxlength="150" placeholder="Contanos qué problema encontraste..." required></textarea>
            </div>

            <button type="submit" class="boton-enviar-reporte" id="reporte-btn-enviar">Enviar reporte</button>

            <p id="reporte-mensaje" class="mensaje-reporte" hidden></p>
        </form>
    </div>
</main>
