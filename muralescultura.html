    <script>
    // Los comentarios de las tarjetas fijas también usan el servidor.
    let usuarioLogueado = false;

    async function actualizarPermisoComentarios() {
        try {
            const respuesta = await fetch('../backend/auth_session.php', { cache: 'no-store' });
            const sesion = await respuesta.json();
            usuarioLogueado = !!(sesion.usuario_logueado || sesion.admin_logueado);
            document.querySelectorAll('.comentario textarea, .btn-comentar').forEach(el => {
                el.disabled = !usuarioLogueado;
                if (el.tagName === 'TEXTAREA') {
                    el.placeholder = usuarioLogueado ? 'Escribe un comentario...' : 'Iniciá sesión para comentar.';
                }
            });
        } catch (e) {
            usuarioLogueado = false;
        }
    }

    async function agregarComentario(inputId, listaId) {
        if (!usuarioLogueado) {
            alert('Tenés que iniciar sesión para comentar.');
            return;
        }

        const textarea = document.getElementById(inputId);
        const lista = document.getElementById(listaId);
        const texto = textarea ? textarea.value.trim() : '';
        if (!texto) return;

        // Las tarjetas fijas usan su número de mural como identificador.
        const tarjeta = textarea ? textarea.closest('.card') : null;
        const detalle = tarjeta ? tarjeta.querySelector('.check-detalle') : null;
        const idMural = detalle ? parseInt((detalle.id || '').replace('detallemural', ''), 10) : 0;
        if (!idMural) {
            alert('No se pudo identificar el mural.');
            return;
        }

        const datos = new FormData();
        datos.append('id_mural', idMural);
        datos.append('comentario', texto);

        try {
            const respuesta = await fetch('../backend/guardar_comentario.php', {
                method: 'POST',
                body: datos,
                credentials: 'same-origin'
            });
            const json = await respuesta.json();
            if (!json.ok) {
                alert(json.mensaje || 'No se pudo guardar el comentario.');
                return;
            }

            const nuevo = document.createElement('div');
            nuevo.className = 'item-comentario';
            nuevo.textContent = texto;
            if (lista) lista.prepend(nuevo);
            textarea.value = '';
        } catch (e) {
            alert('No se pudo conectar con el servidor.');
        }
    }

    window.addEventListener('sesionActualizada', function (evento) {
        const sesion = evento.detail || {};
        usuarioLogueado = !!(sesion.usuario_logueado || sesion.admin_logueado);
        document.querySelectorAll('.comentario textarea, .btn-comentar').forEach(el => {
            el.disabled = !usuarioLogueado;
            if (el.tagName === 'TEXTAREA') {
                el.placeholder = usuarioLogueado ? 'Escribe un comentario...' : 'Iniciá sesión para comentar.';
            }
        });
    });

    actualizarPermisoComentarios();
</script>
